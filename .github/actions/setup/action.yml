name: Set up yamk
description: Install uv, yamk, and optional project dependencies

inputs:
  python-version:
    description: Python version to install
    required: true
  dependency-group:
    description: Dependency group to install, if needed
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: false
        python-version: ${{ inputs.python-version }}
    - name: Install cli tools
      shell: bash
      run: uv tool install yamk
    - name: Install dependencies
      if: ${{ inputs.dependency-group != '' }}
      shell: bash
      env:
        UV_GROUPS: --no-dev --group ${{ inputs.dependency-group }}
      run: yam install
