name: lint
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PYTHONUTF8: 1

jobs:
  lint-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: Set up yamk
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          dependency-group: lint
      - name: Lint the project
        run: |
          yam -e ci-lint
